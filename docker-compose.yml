# Local MongoDB as a single-node replica set. Transactions (used to keep doctor.patientCount
# in sync) only work on a replica set, so a plain standalone mongod is not enough.
services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # The healthcheck doubles as the replica set initiator: the first run calls rs.initiate,
    # later runs just confirm the node is primary.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

volumes:
  mongo-data:
